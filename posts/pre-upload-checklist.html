    <span class="eyebrow">Guide 12 · Checklist</span>
    <h1>Pre-Upload Copyright Checklist</h1>
    <p class="lede">Print this, or keep it in a note next to your upload button. Twenty checks, about four minutes. It catches the overwhelming majority of copyright problems before they become claims, and it gives you an answer for every dispute that follows.</p>
    <div class="pill-row">
      <span class="pill">5 min read</span>
      <span class="pill">Use on every upload</span>
    </div>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="toc" data-toc></div>

    <article class="card prose">
      <p class="excerpt" style="font-size:1.05rem;color:var(--muted)">
        Most copyright problems are administrative, not creative. They happen because nobody tracked where a track
        came from, or because a video changed its commercial status after it was made. Both are fixed by a
        routine, and the routine is short.
      </p>

      <h2>Part 1 — Before you upload (20 points)</h2>

      <h3>Inventory (points 1–5)</h3>
      <ul class="checklist">
        <li>List every piece of music in the video — background, stings, sound effects, and any track in a clip you included.</li>
        <li>List every piece of video footage, and every still image, that you did not record or create yourself.</li>
        <li>List every font, template, preset, LUT, plugin preset and graphic you used that you did not create.</li>
        <li>For each item, can you name the owner or the source? If not, that item is the risk.</li>
        <li>Check whether you are using the <em>newest</em> version of a track you already hold — library subscriptions change and tracks get withdrawn.</li>
      </ul>

      <h3>Permission and licence (points 6–13)</h3>
      <ul class="checklist">
        <li>Each third-party item has a licence, a purchase receipt, a platform licence, or written permission — and you can produce it right now.</li>
        <li>The licence covers <strong>this platform</strong>. A library licence valid on YouTube may not cover TikTok, Instagram, or your own website.</li>
        <li>The licence permits <strong>commercial</strong> use if this video is monetised, sponsored, paid-member-only, or used for a client.</li>
        <li>The permitted <strong>duration</strong> of any excerpt is enough for what you used.</li>
        <li>Stock media is the right licence type: standard for your own content, extended if merchandise or multiple products, template licence if you are selling templates.</li>
        <li>Any recognisable people, private property or branded products in stock footage have appropriate releases for commercial use.</li>
        <li>Music bundled inside stock footage is cleared for monetised, cross-platform use.</li>
        <li>Any Creative Commons work is used within its exact conditions (BY, SA, NC, ND), including attribution and share-alike obligations.</li>
      </ul>

      <h3>Fair use (points 14–16)</h3>
      <ul class="checklist">
        <li>Any borrowed material is there for a recognised purpose — criticism, comment, review, parody, teaching — not decoration.</li>
        <li>Your own contribution is structural: analysis, argument, framing, throughout the video, not just an intro.</li>
        <li>You use the minimum necessary amount of each excerpt, and you could write three sentences justifying each one on request.</li>
      </ul>

      <h3>Records (points 17–18)</h3>
      <ul class="checklist">
        <li>Your licence log entry for this video is filled in: track name, source, licence type, date, platforms cleared, where the licence file lives.</li>
        <li>Your credits are ready in the exact format the licence requires, and will survive being truncated by a platform.</li>
      </ul>

      <h3>Your own work (points 19–20)</h3>
      <ul class="checklist">
        <li>Your own music has Content ID enabled, so misattribution is traceable and your rights are enforced.</li>
        <li>If this video will be monetised or sponsored and it uses any track you were not certain about, you have a licensed fallback ready to swap in.</li>
      </ul>

      <h2>Part 2 — Your licence log</h2>
      <p>
        This is the single highest-value habit on the page. One row per licensed element per project. A spreadsheet
        or a note with these columns takes 30 seconds to fill and saves weeks during a dispute:
      </p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Item</th><th>Owner / artist</th><th>Source &amp; licence type</th><th>Date</th><th>Platforms cleared</th><th>Evidence location</th></tr>
          </thead>
          <tbody>
            <tr><td>[Track title]</td><td>[Artist]</td><td>[Library], standard licence</td><td>[Date]</td><td>YT, IG, TikTok, site</td><td>licences/[filename].pdf</td></tr>
            <tr><td>[Clip title]</td><td>[Uploader]</td><td>Direct permission, email</td><td>[Date]</td><td>YT, IG</td><td>licences/[thread].pdf</td></tr>
            <tr><td>[Image]</td><td>[Photographer]</td><td>CC BY 4.0</td><td>[Date]</td><td>All</td><td>link in description</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Part 3 — Your first 24 hours after a claim or notice</h2>
      <ol class="steps">
        <li><strong>Do not delete the video.</strong> It is your evidence, and deleting often worsens the outcome.</li>
        <li><strong>Screenshot everything</strong> — the claim details, the email, the timestamps, the video page.</li>
        <li><strong>Identify the type.</strong> Content ID claim, platform policy violation, or DMCA takedown? The process and deadline are different.</li>
        <li><strong>Check your deadline now.</strong> Content ID disputes are often 30 days; counter-notices have legal deadlines that are shorter and vary by country.</li>
        <li><strong>Pull the licence from your log.</strong> If it exists, the dispute is a 15-minute job with evidence attached.</li>
        <li><strong>If no licence exists, decide honestly.</strong> Licensed, fair use, or neither? Only the third option means you do not file a counter-notice.</li>
        <li><strong>Write the dispute in three sentences</strong> — what you used, why you have the right, where the evidence is. No emotion, no accusations.</li>
        <li><strong>Submit.</strong> Save a copy of everything you sent.</li>
        <li><strong>Replace the element</strong> with a properly licensed alternative so the same video is not re-uploaded unchanged.</li>
        <li><strong>Fix the process</strong>, not just the video — the next upload should not repeat the mistake.</li>
      </ol>

      <h2>Part 4 — Quarterly maintenance</h2>
      <ul class="checklist">
        <li>Re-check every stock music subscription you rely on; confirm it is still active.</li>
        <li>Re-audit your top ten most-used tracks — verify licences, terms, and Content ID reference status.</li>
        <li>Review old videos that have since been monetised, sponsored, or re-published on a new platform.</li>
        <li>Check your channel's copyright strike record and expiry dates.</li>
        <li>Confirm your own work is registered and Content ID is enabled where relevant.</li>
        <li>Delete or replace any video you would not be able to defend today.</li>
      </ul>

      <div class="note">
        <b>Keep a licensed fallback library</b>
        <p>Maintain a small folder of tracks and clips you can drop in instantly — cleared for monetised, cross-platform
        use. It is the difference between a same-day fix and a week of silence when something is claimed.</p>
      </div>

      <h2>Summary</h2>
      <p>
        Track where everything came from, keep the evidence, re-check when a video becomes more commercial, and
        respond fast when something lands. That is the entire discipline. Everything else on this site is detail
        in service of those four things.
      </p>
    </article>
